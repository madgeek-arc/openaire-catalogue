# Properties of the Resource Catalogue (database, Elasticsearch, OIDC, mail, ...) are supplied by the deployment.
# Only the OpenAIRE-specific settings are listed here.

## Administrators and onboarding team (emails)
#catalogue.admins=
#catalogue.onboarding-team=

## OpenAIRE extensions
openaire.project-name=OpenAIRE
openaire.default-resource-owner=openaire
openaire.pending-resources-active=true
openaire.default-channels=oa
openaire.invitations.required=true
openaire.invitations.parameter=invitation

## Search
registry.elasticsearch.search.prefix-matching.enabled=true

## Invitation tokens (HMAC secret of at least 32 characters, to be provided by the deployment)
#invitation.jws.secret=
invitation.hash-algorithm=SHA3-256
invitation.ttl=30d

## Swagger groups. An indexed list comes from a single property source, so the defaults are repeated here.
springdoc.group-configs[0].group=resource-catalogue
springdoc.group-configs[0].display-name=1.Resource Catalogue
springdoc.group-configs[0].packages-to-scan=gr.uoa.di.madgik.resourcecatalogue
springdoc.group-configs[1].group=dynamic-catalogue
springdoc.group-configs[1].display-name=2.Dynamic Catalogue
springdoc.group-configs[1].packages-to-scan=gr.uoa.di.madgik.catalogue
springdoc.group-configs[2].group=registry
springdoc.group-configs[2].display-name=3.Registry
springdoc.group-configs[2].packages-to-scan=gr.uoa.di.madgik.registry
springdoc.group-configs[3].group=openaire
springdoc.group-configs[3].display-name=4.OpenAIRE
springdoc.group-configs[3].packages-to-scan=eu.openaire.catalogue

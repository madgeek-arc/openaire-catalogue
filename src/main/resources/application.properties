# Connection settings (database, Elasticsearch, ActiveMQ, Redis, OIDC, mail) and secrets are supplied by the
# deployment. The settings below are the defaults of the application.

server.servlet.context-path=/api
server.forward-headers-strategy=framework
# Restoring a catalogue dump uploads one large file
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

## Model validation and registry: records are validated against their models before they are stored
catalogue-lib.model.validation.enabled=true
# Base address of this application
catalogue-lib.model.validation.base-url=http://localhost:${server.port:8080}
catalogue-lib.model.resource-type-sync.on-create=false
catalogue-lib.model.resource-type-sync.on-update=false
registry.elasticsearch.search.prefix-matching.enabled=true
# Of the resource type files on the classpath, only the model type is created at startup
registry.resource-type-init.location=classpath*:resourceTypes/model.json
# Public address of the API, used in resource sync links
registry.host=http://localhost:${server.port:8080}${server.servlet.context-path}

#registry.datasource.url=
#registry.datasource.username=
#registry.datasource.password=
#registry.elasticsearch.uris=
#registry.elasticsearch.username=
#registry.elasticsearch.password=
# JMS is off until the topics consumers expect are confirmed. When on, every record change is published to
# <prefix>.<resource type>.<create|update|delete>.
registry.jms.enabled=false
registry.jms.prefix=openaire
#registry.jms.host=

## Users
#catalogue.admins=
#catalogue.onboarding-team=
#openaire.login-redirect=
#openaire.logout-redirect=
#openaire.allowed-origins=

## Records
openaire.project-name=OpenAIRE
openaire.catalogue-id=openaire
openaire.channels=oa,node
openaire.eosc-channel=node
openaire.invitations.required=true
openaire.invitations.parameter=invitation

## Notifications (spring.mail.* configures the mail server)
openaire.emails.enabled=false
#openaire.emails.from=
#openaire.emails.registration-to=
openaire.emails.provider-notifications=true
#openaire.homepage=

## OpenAIRE datasource APIs
#openaire.dsm.url=
#openaire.dsm.provide-url=

## Invitation tokens (HMAC secret of at least 32 characters, to be provided by the deployment)
#invitation.jws.secret=
invitation.hash-algorithm=SHA3-256
invitation.ttl=30d

## Swagger groups
# The Swagger UI files are looked up under this webjar version, which must match the swagger-ui dependency
springdoc.swagger-ui.version=@swagger-ui.version@
springdoc.group-configs[0].group=openaire
springdoc.group-configs[0].display-name=1.OpenAIRE
springdoc.group-configs[0].packages-to-scan=eu.openaire.catalogue
springdoc.group-configs[1].group=dynamic-catalogue
springdoc.group-configs[1].display-name=2.Dynamic Catalogue
springdoc.group-configs[1].packages-to-scan=gr.uoa.di.madgik.catalogue
springdoc.group-configs[2].group=registry
springdoc.group-configs[2].display-name=3.Registry
springdoc.group-configs[2].packages-to-scan=gr.uoa.di.madgik.registry
